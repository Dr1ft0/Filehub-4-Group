<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>脚本仙人</title>
<style>
  :root {
    --bg0: #0a0f1e;
    --bg1: #0f1528;
    --card: #121a30;
    --card2: #17203a;
    --border: #26314f;
    --border2: #334065;
    --text: #e7edf7;
    --muted: #8b98b5;
    --faint: #5b6b8c;
    --primary: #6366f1;
    --primary2: #8b5cf6;
    --blue: #38bdf8;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1c2547 0%, transparent 55%),
                radial-gradient(1000px 500px at 90% 0%, #2a1f4d 0%, transparent 50%),
                linear-gradient(180deg, var(--bg1), var(--bg0));
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .container { max-width: 1180px; margin: 0 auto; padding: 30px 20px 60px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--primary), var(--primary2));
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    box-shadow: 0 6px 18px rgba(99,102,241,.35);
  }
  h1 {
    font-size: 24px; font-weight: 700; letter-spacing: .5px;
    background: linear-gradient(90deg, #a5b4fc, #c4b5fd);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .card h2 { font-size: 16px; margin-bottom: 14px; color: #a5b4fc; font-weight: 600; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  input, textarea, select {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border2);
    background: var(--bg0); color: var(--text); margin-bottom: 10px; font-size: 13px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
  textarea { min-height: 70px; font-family: "Cascadia Code", Consolas, monospace; resize: vertical; }
  button {
    padding: 8px 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
    transition: transform .1s, box-shadow .15s, background .15s;
  }
  button:active { transform: translateY(1px); }
  button.primary { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; box-shadow: 0 4px 14px rgba(99,102,241,.3); }
  button.primary:hover { box-shadow: 0 6px 20px rgba(99,102,241,.45); }
  button.secondary { background: var(--border2); color: var(--text); }
  button.secondary:hover { background: #3d4a75; }
  button.ghost { background: transparent; border: 1px solid var(--border2); color: var(--muted); }
  button.ghost:hover { background: var(--card2); color: var(--text); }
  button.small { padding: 3px 8px; font-size: 12px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 7px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: rgba(99,102,241,.05); }
  .desc-cell { color: #cbd5e1; max-width: 240px; word-break: break-all; }
  .link { color: var(--blue); cursor: pointer; text-decoration: none; margin-right: 10px; white-space: nowrap; }
  .link:hover { text-decoration: underline; }
  .danger { color: var(--red); cursor: pointer; white-space: nowrap; }
  .danger:hover { text-decoration: underline; }
  .alert { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
  .alert.error { background: rgba(248,113,113,.15); color: #fca5a5; border: 1px solid rgba(248,113,113,.3); }
  .alert.ok { background: rgba(52,211,153,.15); color: #6ee7b7; border: 1px solid rgba(52,211,153,.3); }
  #loginView .card { text-align: left; }
  .filebadge { background: var(--border2); padding: 2px 9px; border-radius: 10px; font-size: 11px; color: var(--muted); }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; border: 1px solid var(--border2); color: var(--muted); background: transparent; }
  .tab.active { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; border-color: transparent; }
  .pagination { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .pagination button { padding: 4px 10px; font-size: 12px; }
  .userinfo { color: var(--muted); font-size: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 11px; margin-left: 4px; }
  .tag.public { background: rgba(52,211,153,.2); color: #6ee7b7; }
  .tag.shared { background: rgba(56,189,248,.2); color: #7dd3fc; }
  .tag.owner { background: rgba(251,191,36,.2); color: #fcd34d; }
  .tag.admin { background: rgba(248,113,113,.2); color: #fca5a5; }
  .tag.disabled { background: rgba(148,163,184,.2); color: var(--muted); }
  .modal-mask { position: fixed; inset: 0; background: rgba(4,7,18,.68); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
  .modal { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--border2); border-radius: 14px; padding: 22px; width: 90%; max-width: 560px; max-height: 86vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .modal h3 { margin-bottom: 16px; color: #a5b4fc; font-size: 16px; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .searchbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .searchbar input { margin-bottom: 0; }
  .searchbar .search-input { flex: 1 1 220px; min-width: 160px; }
  .filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-row select { flex: 1 1 0; min-width: 120px; margin-bottom: 0; }
  .filter-row .fl-label { font-size: 12px; color: var(--faint); white-space: nowrap; }
  .tagcloud { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .tagcloud .tg-title { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .af-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; color: var(--text); background: var(--card2); border: 1px solid var(--border2); cursor: pointer;
  }
  .af-chip:hover { border-color: var(--red); color: var(--red); }
  .af-chip .af-label { color: var(--faint); }
  .af-chip .af-x { color: var(--red); font-weight: 700; }
  .tag-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; border: 1px solid; white-space: nowrap; line-height: 1.5;
    transition: transform .12s, box-shadow .12s;
  }
  .tag-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
  .tag-chip.clickable { cursor: pointer; }
  .tag-chip.clickable:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,.3); }
  .tag-chip.active { outline: 2px solid currentColor; outline-offset: 1px; }
  .tag-chip .tg-count { margin-left: 3px; padding: 0 5px; border-radius: 8px; background: currentColor; color: #0a0f1e; font-weight: 700; font-size: 10px; }
  .tag-cell { max-width: 230px; }
  .tag-cell .tag-chip { margin: 2px 3px 2px 0; }
  .tag-picker { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .tag-picker input { margin-bottom: 0; }
  .tp-selected { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; }
  .tp-selected:empty::after { content: '（未选择标签）'; color: var(--faint); font-size: 12px; }
  .tp-selected .tag-chip { cursor: pointer; }
  .tp-selected .chip-x { margin-left: 3px; font-weight: 700; opacity: .7; }
  .tp-selected .chip-x:hover { opacity: 1; }
  .tp-options { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px dashed var(--border2); border-radius: 8px; min-height: 26px; }
  .tp-options .tag-chip { cursor: pointer; }
  .preview { background: var(--bg0); border: 1px solid var(--border2); border-radius: 8px; padding: 12px; font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; color: #a5f3fc; }
  .muted { color: var(--faint); font-size: 12px; }
  .version-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .version-item:last-child { border-bottom: none; }
  .chk { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .chk input { width: auto; margin: 0; }
  .chk label { margin: 0; }
  .share-users { max-height: 200px; overflow-y: auto; border: 1px solid var(--border2); border-radius: 8px; padding: 6px; margin-bottom: 10px; background: var(--bg0); }
  .share-users::-webkit-scrollbar { width: 8px; }
  .share-users::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  .share-users::-webkit-scrollbar-track { background: transparent; }
  .share-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--text); font-size: 13px; transition: background .15s; }
  .share-user:hover { background: var(--card2); }
  .share-user input[type=checkbox] { width: 16px; height: 16px; margin: 0; flex: 0 0 auto; accent-color: var(--primary); cursor: pointer; }
  .share-user .su-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .share-user .su-role { flex: 0 0 auto; font-size: 11px; color: var(--muted); }
  .share-user .su-role.admin { color: #fca5a5; }
  .empty { text-align: center; color: var(--faint); padding: 22px 0; }
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="logo">📁</div>
    <h1>脚本仙人</h1>
  </div>
  <div class="sub" id="sub">小组脚本共享 · 版本管理 · 标签分类 · 搜索筛选</div>

  <div class="alert" id="alert"></div>

  <!-- 登录视图 -->
  <div id="loginView">
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
      <button class="tab" id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>

    <div class="card" id="loginForm">
      <h2>登录</h2>
      <label>用户名</label>
      <input id="username" placeholder="请输入用户名" />
      <label>密码</label>
      <input id="password" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()" />
      <button class="primary" onclick="login()" style="width:100%">登录</button>
    </div>

    <div class="card" id="registerForm" style="display:none">
      <h2>注册新账号</h2>
      <label>用户名（3-32 位，字母/数字/下划线）</label>
      <input id="regUsername" placeholder="如 zhangsan" />
      <label>密码（至少 6 位）</label>
      <input id="regPassword" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')register()" />
      <button class="primary" onclick="register()" style="width:100%">注册</button>
    </div>
  </div>

  <!-- 主视图 -->
  <div id="appView" style="display:none">
    <div class="userinfo">
      <span id="userInfo"></span>
      <span>
        <button class="ghost small" id="adminBtn" style="display:none" onclick="openAdmin()">👥 用户管理</button>
        <button class="ghost small" onclick="logout()">退出登录</button>
      </span>
    </div>

    <!-- 上传 -->
    <div class="card">
      <h2>上传文件</h2>
      <label>选择文件（任意类型，上限 5MB）</label>
      <input type="file" id="fileInput" />
      <label>简介（可选）</label>
      <input id="fileDesc" placeholder="一句话说明这个文件的用途" />
      <label>标签（可选，点击下方现有标签复用，或输入新标签后回车）</label>
      <div class="tag-picker">
        <div class="tp-selected" id="uploadTagsSel"></div>
        <input id="uploadTagsInput" placeholder="输入新标签后回车，可用逗号分隔多个" />
        <div class="tp-options" id="uploadTagsOpts"></div>
      </div>
      <div style="margin-top:10px">
        <button class="primary" onclick="uploadFile()">上传文件</button>
      </div>
    </div>

    <!-- 文件列表 -->
    <div class="card">
      <h2>文件列表 <span class="filebadge" id="count">0</span></h2>
      <div class="searchbar">
        <input id="searchInput" class="search-input" placeholder="搜索文件名 / 简介 / 标签…（快捷键 Ctrl+K）" />
        <button class="primary" onclick="doSearch()">搜索</button>
        <button class="ghost" onclick="clearSearch()">清除</button>
      </div>
      <div class="filter-row">
        <select id="sortSelect" onchange="changeSort()">
          <option value="updatedAt_desc">更新时间 ↓</option>
          <option value="updatedAt_asc">更新时间 ↑</option>
          <option value="name_asc">名称 A→Z</option>
          <option value="name_desc">名称 Z→A</option>
          <option value="size_desc">大小 ↓</option>
          <option value="size_asc">大小 ↑</option>
        </select>
        <select id="ownerFilter" onchange="applyFilter()">
          <option value="">全部上传者</option>
        </select>
        <select id="extFilter" onchange="applyFilter()">
          <option value="">全部类型</option>
          <option value=".sh">Shell (.sh)</option>
          <option value=".py">Python (.py)</option>
          <option value=".js">JavaScript (.js)</option>
          <option value=".md">Markdown (.md)</option>
          <option value=".json">JSON (.json)</option>
          <option value=".txt">文本 (.txt)</option>
          <option value=".yml">YAML (.yml)</option>
          <option value=".sql">SQL (.sql)</option>
          <option value=".bat">批处理 (.bat)</option>
          <option value=".zip">压缩包 (.zip)</option>
          <option value="__other__">其它</option>
        </select>
      </div>
      <div class="tagcloud" id="tagCloud"><span class="muted">加载标签中…</span></div>
      <div class="active-filters" id="activeFilters" style="display:none"></div>
      <table>
        <thead><tr><th>文件名</th><th>简介</th><th>标签</th><th>大小</th><th>版本</th><th>更新时间</th><th>操作</th></tr></thead>
        <tbody id="fileList"></tbody>
      </table>
      <div class="pagination" id="pagination" style="display:none">
        <button class="secondary" onclick="changePage(-1)">上一页</button>
        <span id="pageInfo"></span>
        <button class="secondary" onclick="changePage(1)">下一页</button>
      </div>
      <div style="margin-top:16px">
        <button class="secondary" onclick="refreshList()">刷新列表</button>
      </div>
    </div>
  </div>
</div>

<!-- 版本历史弹窗 -->
<div class="modal-mask" id="versionModal">
  <div class="modal">
    <h3 id="versionModalTitle">版本历史</h3>
    <div id="versionList"></div>
    <div class="actions">
      <button class="secondary" onclick="closeModal('versionModal')">关闭</button>
    </div>
  </div>
</div>

<!-- 新增版本弹窗 -->
<div class="modal-mask" id="addVersionModal">
  <div class="modal">
    <h3>新增版本</h3>
    <label>更新说明</label>
    <input id="avNote" placeholder="本次改了什么？" />
    <div id="avFileUpload">
      <label>选择文件作为新版本（任意类型，上限 5MB）</label>
      <input type="file" id="avFileInput" />
    </div>
    <div class="actions">
      <button class="secondary" onclick="closeModal('addVersionModal')">取消</button>
      <button class="primary" onclick="submitAddVersion()">保存新版本</button>
    </div>
  </div>
</div>

<!-- 共享设置弹窗 -->
<div class="modal-mask" id="shareModal">
  <div class="modal">
    <h3>共享设置</h3>
    <div class="chk">
      <input type="checkbox" id="sharePublic" />
      <label for="sharePublic">设为小组公共文件（所有人可见）</label>
    </div>
    <label>共享给指定成员</label>
    <div id="shareUsers" class="share-users"></div>
    <div class="muted" style="margin-bottom:10px">勾选要共享的成员。公共文件 + 指定共享可同时生效。</div>
    <div class="actions">
      <button class="secondary" onclick="closeModal('shareModal')">取消</button>
      <button class="primary" onclick="submitShare()">保存</button>
    </div>
  </div>
</div>

<!-- 重命名弹窗 -->
<div class="modal-mask" id="renameModal">
  <div class="modal">
    <h3>重命名</h3>
    <label>新文件名</label>
    <input id="renameInput" />
    <div class="actions">
      <button class="secondary" onclick="closeModal('renameModal')">取消</button>
      <button class="primary" onclick="submitRename()">保存</button>
    </div>
  </div>
</div>

<!-- 编辑信息弹窗（简介 + 标签） -->
<div class="modal-mask" id="editDescModal">
  <div class="modal">
    <h3>编辑文件信息</h3>
    <label>文件简介（可选，最多 500 字）</label>
    <textarea id="editDescInput" style="min-height:80px" placeholder="一句话说明这个文件的用途"></textarea>
    <label>标签（点击复用现有标签，或输入新标签后回车，最多 10 个）</label>
    <div class="tag-picker">
      <div class="tp-selected" id="editTagsSel"></div>
      <input id="editTagsInput" placeholder="输入新标签后回车，可用逗号分隔多个" />
      <div class="tp-options" id="editTagsOpts"></div>
    </div>
    <div class="actions">
      <button class="secondary" onclick="closeModal('editDescModal')">取消</button>
      <button class="primary" onclick="submitEditInfo()">保存</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-mask" id="confirmModal">
  <div class="modal" style="max-width:420px">
    <h3 id="confirmTitle">确认删除</h3>
    <p id="confirmMessage" style="color:var(--text);line-height:1.6;margin:8px 0 16px"></p>
    <div class="actions">
      <button class="secondary" onclick="closeModal('confirmModal')">取消</button>
      <button id="confirmOkBtn" style="background:#dc2626" onclick="confirmAction()">确认删除</button>
    </div>
  </div>
</div>

<!-- 在线预览弹窗 -->
<div class="modal-mask" id="previewModal">
  <div class="modal">
    <h3 id="previewTitle">在线预览</h3>
    <div class="preview" id="previewContent"></div>
    <div class="actions">
      <button class="secondary" onclick="closeModal('previewModal')">关闭</button>
    </div>
  </div>
</div>

<!-- 用户管理弹窗 -->
<div class="modal-mask" id="adminModal">
  <div class="modal" style="max-width:720px">
    <h3>👥 用户管理</h3>
    <table>
      <thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
      <tbody id="adminUserList"></tbody>
    </table>
    <div class="actions">
      <button class="secondary" onclick="closeModal('adminModal')">关闭</button>
    </div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('fh_token') || null
let currentPage = 1
let currentUser = null
let currentSearch = ''
let currentFileId = null
let currentSort = { sortBy: 'updatedAt', order: 'desc' }
let currentOwner = ''
let currentExt = ''
let currentTags = []
let currentFiles = []
let allTags = []
let allOwners = []
let searchTimer = null
const uploadPicker = { tags: [], sel: 'uploadTagsSel', input: 'uploadTagsInput', opts: 'uploadTagsOpts' }
const editPicker = { tags: [], sel: 'editTagsSel', input: 'editTagsInput', opts: 'editTagsOpts' }
const PAGE_SIZE = 10

const $ = (id) => document.getElementById(id)
function showAlert(msg, type = 'error') {
  const a = $('alert')
  a.textContent = msg
  a.className = 'alert ' + type
  a.style.display = 'block'
  setTimeout(() => (a.style.display = 'none'), 3000)
}

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) }
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN
  const res = await fetch('/api' + path, { ...options, headers })
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.message || 'HTTP ' + res.status)
  return data
}

// ---- 登录/注册 Tab ----
function switchTab(tab) {
  $('tabLogin').className = 'tab' + (tab === 'login' ? ' active' : '')
  $('tabRegister').className = 'tab' + (tab === 'register' ? ' active' : '')
  $('loginForm').style.display = tab === 'login' ? 'block' : 'none'
  $('registerForm').style.display = tab === 'register' ? 'block' : 'none'
}

async function login() {

// ---- 标签 / 上传者聚合（供筛选） ----
async function loadMeta() {
  try {
    const meta = await api('/files/meta')
    allTags = meta.tags || []
    allOwners = meta.owners || []
  } catch { allTags = []; allOwners = [] }
  renderOwnerFilter()
  renderTagCloud()
  renderPicker(uploadPicker)
  renderPicker(editPicker)
}

function renderOwnerFilter() {
  const sel = $('ownerFilter')
  const prev = currentOwner || sel.value || ''
  sel.innerHTML = '<option value="">全部上传者</option>' +
    allOwners.map((o) => '<option value="' + escapeAttr(o) + '"' + (o === prev ? ' selected' : '') + '>' + escapeHtml(o) + '</option>').join('')
  if (prev) sel.value = prev
}

function tagColor(tag) {
  const palette = ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#34d399', '#2dd4bf', '#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#fb7185', '#94a3b8']
  let h = 0
  for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) >>> 0
  return palette[h % palette.length]
}

function makeTagChip(tag, onClick) {
  const c = tagColor(tag)
  const s = document.createElement('span')
  s.className = 'tag-chip' + (onClick ? ' clickable' : '')
  s.style.background = c + '22'
  s.style.color = c
  s.style.borderColor = c + '44'
  s.innerHTML = '<span class="dot"></span>' + escapeHtml(tag)
  if (onClick) s.addEventListener('click', onClick)
  return s
}

// ---- 标签选择器（复用现有标签 + 自由输入）----
function renderPicker(p) {
  const selBox = $(p.sel)
  selBox.innerHTML = ''
  p.tags.forEach((t) => {
    const c = tagColor(t)
    const chip = document.createElement('span')
    chip.className = 'tag-chip'
    chip.style.background = c + '22'
    chip.style.color = c
    chip.style.borderColor = c + '44'
    chip.innerHTML = '<span class="dot"></span>' + escapeHtml(t) + '<span class="chip-x">×</span>'
    chip.addEventListener('click', () => removePickerTag(p, t))
    selBox.appendChild(chip)
  })
  const optBox = $(p.opts)
  optBox.innerHTML = ''
  if (allTags.length === 0) {
    optBox.innerHTML = '<span class="muted">暂无现有标签，可直接在上方输入新标签</span>'
  } else {
    allTags.forEach(({ tag, count }) => {
      const chip = makeTagChip(tag, () => addPickerTag(p, tag))
      if (p.tags.includes(tag)) chip.classList.add('active')
      const cnt = document.createElement('span')
      cnt.className = 'tg-count'
      cnt.textContent = count
      chip.appendChild(cnt)
      optBox.appendChild(chip)
    })
  }
}

function addPickerTag(p, tag) {
  if (!p.tags.includes(tag)) p.tags.push(tag)
  $(p.input).value = ''
  renderPicker(p)
}

function removePickerTag(p, tag) {
  const i = p.tags.indexOf(tag)
  if (i >= 0) p.tags.splice(i, 1)
  renderPicker(p)
}

function commitPickerInput(p) {
  const raw = $(p.input).value.trim()
  if (!raw) return
  raw.split(/[,，;；\n]+/).forEach((t) => {
    t = t.trim()
    if (t && !p.tags.includes(t)) p.tags.push(t)
  })
  $(p.input).value = ''
  renderPicker(p)
}

function resetPicker(p) {
  p.tags = []
  $(p.input).value = ''
  renderPicker(p)
}

function renderTagCloud() {
  const box = $('tagCloud')
  box.innerHTML = ''
  if (allTags.length === 0) {
    box.innerHTML = '<span class="muted">暂无标签</span>'
    return
  }
  const title = document.createElement('span')
  title.className = 'tg-title'
  title.textContent = '标签筛选：'
  box.appendChild(title)
  allTags.forEach(({ tag, count }) => {
    const chip = makeTagChip(tag, () => toggleTagFilter(tag))
    if (currentTags.includes(tag)) chip.classList.add('active')
    const cnt = document.createElement('span')
    cnt.className = 'tg-count'
    cnt.textContent = count
    chip.appendChild(cnt)
    box.appendChild(chip)
  })
}

function toggleTagFilter(tag) {
  const i = currentTags.indexOf(tag)
  if (i >= 0) currentTags.splice(i, 1)
  else currentTags.push(tag)
  currentPage = 1
  refreshList()
}

function renderActiveFilters() {
  const box = $('activeFilters')
  box.innerHTML = ''
  const parts = []
  if (currentSearch) parts.push(['搜索', currentSearch, () => clearSearch()])
  if (currentOwner) parts.push(['上传者', currentOwner, () => { $('ownerFilter').value = ''; applyFilter() }])
  if (currentExt) parts.push(['类型', extLabel(currentExt), () => { $('extFilter').value = ''; applyFilter() }])
  currentTags.forEach((t) => parts.push(['标签', t, () => toggleTagFilter(t)]))
  if (parts.length === 0) { box.style.display = 'none'; return }
  box.style.display = 'flex'
  parts.forEach(([label, val, fn]) => {
    const c = document.createElement('span')
    c.className = 'af-chip'
    c.innerHTML = '<span class="af-label">' + label + '：</span>' + escapeHtml(val) + ' <span class="af-x">✕</span>'
    c.addEventListener('click', fn)
    box.appendChild(c)
  })
}

function extLabel(v) {
  const map = { '.sh': 'Shell', '.py': 'Python', '.js': 'JavaScript', '.md': 'Markdown', '.json': 'JSON', '.txt': '文本', '.yml': 'YAML', '.sql': 'SQL', '.bat': '批处理', '.zip': '压缩包', '__other__': '其它' }
  return map[v] || v
}

// ---- 文件列表 ----
async function refreshList() {
  try {
    let url = '/files?page=' + currentPage + '&pageSize=' + PAGE_SIZE
    if (currentSearch) url += '&q=' + encodeURIComponent(currentSearch)
    if (currentSort) url += '&sortBy=' + currentSort.sortBy + '&order=' + currentSort.order
    if (currentOwner) url += '&owner=' + encodeURIComponent(currentOwner)
    if (currentExt) url += '&ext=' + encodeURIComponent(currentExt)
    if (currentTags.length) url += '&tag=' + encodeURIComponent(currentTags.join(','))
    const data = await api(url)
    currentFiles = data.items
    const tbody = $('fileList')
    tbody.innerHTML = ''
    $('count').textContent = data.total
    if (data.items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty">没有符合条件的文件，试试调整筛选或搜索条件</div></td></tr>'
      $('pagination').style.display = 'none'
    } else {
      data.items.forEach((f) => {
        const tr = document.createElement('tr')
        const isOwner = f.owner === currentUser.username
        let badges = ''
        if (isOwner) badges += '<span class="tag owner">我的</span>'
        if (f.isPublic) badges += '<span class="tag public">公共</span>'
        if (!isOwner && Array.isArray(f.sharedWith) && f.sharedWith.includes(currentUser.username)) badges += '<span class="tag shared">共享</span>'

        let ops = ''
        ops += '<a class="link" onclick="downloadFile(\'' + f.id + '\')">下载</a>'
        ops += '<a class="link" onclick="previewFile(\'' + f.id + '\')">预览</a>'
        ops += '<a class="link" onclick="openVersions(\'' + f.id + '\')">版本</a>'
        if (isOwner || currentUser.role === 'admin') {
          ops += '<a class="link" onclick="openAddVersion(\'' + f.id + '\')">新版本</a>'
          ops += '<a class="link" onclick="openShare(\'' + f.id + '\')">共享</a>'
          ops += '<a class="link" onclick="openEditInfo(\'' + f.id + '\')">编辑</a>'
          ops += '<a class="link" onclick="openRename(\'' + f.id + '\')">重命名</a>'
          ops += '<span class="danger" onclick="deleteFile(\'' + f.id + '\')">删除</span>'
        }

        const tdName = document.createElement('td')
        tdName.innerHTML = escapeHtml(f.name) + badges
        const tdDesc = document.createElement('td')
        tdDesc.className = 'desc-cell'
        tdDesc.innerHTML = f.description ? escapeHtml(f.description) : '<span style="color:var(--faint)">—</span>'
        const tdTags = buildTagCell(f.tags)
        const tdSize = document.createElement('td'); tdSize.textContent = formatSize(f.size)
        const tdVer = document.createElement('td'); tdVer.textContent = 'v' + f.currentVersion
        const tdTime = document.createElement('td'); tdTime.textContent = new Date(f.updatedAt).toLocaleString('zh-CN')
        const tdOps = document.createElement('td'); tdOps.innerHTML = ops
        tr.append(tdName, tdDesc, tdTags, tdSize, tdVer, tdTime, tdOps)
        tbody.appendChild(tr)
      })
      const totalPages = Math.max(1, Math.ceil(data.total / PAGE_SIZE))
      $('pageInfo').textContent = '第 ' + data.page + ' / ' + totalPages + ' 页'
      $('pagination').style.display = data.total > PAGE_SIZE ? 'flex' : 'none'
    }
    renderTagCloud()
    renderActiveFilters()
  } catch (e) { showAlert(e.message) }
}

function buildTagCell(tags) {
  const td = document.createElement('td')
  td.className = 'tag-cell'
  if (!Array.isArray(tags) || tags.length === 0) {
    td.innerHTML = '<span style="color:var(--faint)">—</span>'
    return td
  }
  tags.forEach((t) => {
    const chip = makeTagChip(t, () => toggleTagFilter(t))
    if (currentTags.includes(t)) chip.classList.add('active')
    td.appendChild(chip)
  })
  return td
}

function changePage(delta) {
  currentPage = Math.max(1, currentPage + delta)

// ---- 上传 ----
async function uploadFile() {
  const fileInput = $('fileInput')
  const file = fileInput.files[0]
  if (!file) return showAlert('请先选择文件')
  if (file.size > 5 * 1024 * 1024) return showAlert('文件超过 5MB 上限')

  const formData = new FormData()
  formData.append('file', file)
  const description = $('fileDesc').value.trim()
  if (description) formData.append('description', description)
  if (uploadPicker.tags.length) formData.append('tags', uploadPicker.tags.join(','))

  try {
    const res = await fetch('/api/files', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + TOKEN },
      body: formData,
    })
    const data = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(data.message || 'HTTP ' + res.status)
    fileInput.value = ''
    $('fileDesc').value = ''
    resetPicker(uploadPicker)
    showAlert('上传成功：' + data.name, 'ok')
    refreshList()
    loadMeta()
  } catch (e) { showAlert(e.message) }
}

// ---- 下载 ----
async function downloadFile(id) {
  try {
    const res = await fetch('/api/files/download/' + id, { headers: { Authorization: 'Bearer ' + TOKEN } })
    if (!res.ok) {
      const data = await res.json().catch(() => ({}))
      showAlert(data.message || '下载失败')
      return
    }
    const cd = res.headers.get('Content-Disposition') || ''
    let filename = 'download'
    const m = cd.match(/filename\*=UTF-8''([^;]+)/)
    if (m) filename = decodeURIComponent(m[1])
    else {
      const m2 = cd.match(/filename="?([^";]+)"?/)
      if (m2) filename = m2[1]
    }
    const blob = await res.blob()
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = filename
    document.body.appendChild(a)
    a.click()
    a.remove()
    URL.revokeObjectURL(url)
    showAlert('已开始下载：' + filename, 'ok')
  } catch (e) { showAlert(e.message) }
}

// ---- 在线预览（文本类） ----
async function previewFile(id) {
  try {
    const res = await fetch('/api/files/download/' + id, { headers: { Authorization: 'Bearer ' + TOKEN } })
    if (!res.ok) {
      const d = await res.json().catch(() => ({}))
      showAlert(d.message || '预览失败')
      return
    }
    const cd = res.headers.get('Content-Disposition') || ''
    let filename = 'file'
    const m = cd.match(/filename\*=UTF-8''([^;]+)/)
    if (m) filename = decodeURIComponent(m[1])
    const text = await res.text()
    $('previewTitle').textContent = '在线预览：' + filename
    $('previewContent').textContent = text.length > 20000 ? text.slice(0, 20000) + '\n\n...（内容过长，已截断，请下载查看）' : text
    openModal('previewModal')
  } catch (e) { showAlert(e.message) }
}

// ---- 版本管理 ----
async function openVersions(id) {
  try {
    const f = currentFiles.find((x) => String(x.id) === String(id)) || {}
    const currentVer = f.currentVersion ?? null
    const versions = await api('/files/' + id + '/versions')
    currentFileId = id
    $('versionModalTitle').textContent = '版本历史：' + (f.name || '')
    const list = $('versionList')
    list.innerHTML = ''
    if (versions.length === 0) {
      list.innerHTML = '<div class="muted">暂无版本记录</div>'
    }
    versions.forEach((v) => {
      const div = document.createElement('div')
      div.className = 'version-item'
      const isCurrent = currentVer === v.version
      const currentTag = isCurrent ? '<span class="tag owner">当前</span>' : ''
      const restoreLink = isCurrent
        ? '<span class="muted">已是当前版本</span>'
        : '<a class="link" onclick="restoreVersion(' + v.version + ')">回滚</a>'
      div.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">' +
        '<div><strong>v' + v.version + '</strong> ' + currentTag + ' · ' + new Date(v.createdAt).toLocaleString('zh-CN') +
        ' · 由 ' + escapeHtml(v.updatedBy) + ' · ' + formatSize(v.size) + '</div>' +
        '<div>' +
        '<a class="link" onclick="viewVersion(' + v.version + ')">查看</a>' +
        restoreLink +
        '<a class="link danger" onclick="askDeleteVersion(' + v.version + ')">删除</a>' +
        '</div></div>' +
        (v.changeNote ? '<div class="muted" style="margin-top:4px">📝 ' + escapeHtml(v.changeNote) + '</div>' : '')
      list.appendChild(div)
    })
    openModal('versionModal')
  } catch (e) { showAlert(e.message) }
}

async function viewVersion(version) {
  try {
    const data = await api('/files/' + currentFileId + '/versions/' + version)
    $('previewTitle').textContent = 'v' + version + ' 内容：' + data.name
    $('previewContent').textContent = data.content

}

async function restoreVersion(version) {
  if (!confirm('确定回滚到 v' + version + '？当前版本将切换为 v' + version + '。')) return
  try {
    const res = await api('/files/' + currentFileId + '/versions/' + version + '/restore', { method: 'POST' })
    showAlert('已回滚到 v' + version + '（当前版本：v' + res.currentVersion + '）', 'ok')
    closeModal('versionModal')
    refreshList()
  } catch (e) { showAlert(e.message) }
}

async function openShare(id) {
  currentFileId = id
  const file = currentFiles.find((f) => String(f.id) === String(id)) || {}
  const sharedWith = Array.isArray(file.sharedWith) ? file.sharedWith : []

    const users = await api('/users')
    container.innerHTML = ''
    if (users.length === 0) {
      container.innerHTML = '<div class="muted">暂无其他成员</div>'
      return
    }
    users.forEach((u) => {
      if (u.username === currentUser.username) return
      const checked = sharedWith.includes(u.username) ? 'checked' : ''
      const roleCls = u.role === 'admin' ? 'admin' : ''
      const roleTag = u.role === 'admin' ? '管理员' : '成员'
      const label = document.createElement('label')
      label.className = 'share-user'

        '<input type="checkbox" value="' + escapeAttr(u.username) + '" ' + checked + '>' +
        '<span class="su-name">' + escapeHtml(u.username) + '</span>' +
        '<span class="su-role ' + roleCls + '">' + roleTag + '</span>'
      container.appendChild(label)
    })
  } catch (e) {
    container.innerHTML = '<div class="muted">加载成员失败</div>'

async function submitShare() {

      }
      tr.innerHTML =
        '<td>' + escapeHtml(u.username) + '</td>' +
        '<td>' + roleTag + '</td>' +
        '<td>' + statusTag + '</td>' +
        '<td>' + new Date(u.createdAt).toLocaleString('zh-CN') + '</td>' +
        '<td>' + ops + '</td>'
      tbody.appendChild(tr)
    })
    openModal('adminModal')
  } catch (e) { showAlert(e.message) }
}

async function toggleUserStatus(username, status) {
  const action = status === 'disabled' ? '启用' : '禁用'
  if (!confirm('确定' + action + '用户 ' + username + '？')) return
  try {
    await api('/admin/users/' + username, { method: 'PATCH', body: JSON.stringify({ status: status === 'disabled' ? 'active' : 'disabled' }) })
    showAlert('已' + action + ' ' + username, 'ok')
    openAdmin()
  } catch (e) { showAlert(e.message) }
}

async function toggleUserRole(username, role) {
  const action = role === 'admin' ? '设为普通成员' : '设为管理员'
  if (!confirm('确定将 ' + username + ' ' + action + '？')) return
  try {
    await api('/admin/users/' + username, { method: 'PATCH', body: JSON.stringify({ role: role === 'admin' ? 'user' : 'admin' }) })
    showAlert('已' + action + ' ' + username, 'ok')
    openAdmin()
  } catch (e) { showAlert(e.message) }
}

async function resetUserPwd(username) {
  const newPwd = prompt('为 ' + username + ' 设置新密码（至少 6 位）：')
  if (!newPwd) return
  try {
    await api('/admin/users/' + username + '/reset-password', { method: 'POST', body: JSON.stringify({ newPassword: newPwd }) })
    showAlert('已重置 ' + username + ' 的密码', 'ok')
  } catch (e) { showAlert(e.message) }
}

// ---- 弹窗 ----
function openModal(id) { $(id).style.display = 'flex' }
function closeModal(id) { $(id).style.display = 'none' }

// ---- 工具 ----
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B'
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB'
  return (bytes / 1024 / 1024).toFixed(2) + ' MB'
}

function escapeHtml(s) {
  const A = String.fromCharCode(38)
  const map = {
    '&': A + 'amp;',
    '<': A + 'lt;',
    '>': A + 'gt;',
    '"': A + 'quot;',
    "'": A + '#39;'
  }
  return String(s).replace(/[&<>"']/g, (c) => map[c])
}

function escapeAttr(s) {
  return String(s).replace(/'/g, String.fromCharCode(92) + "'")
}

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-mask').forEach((m) => {
  m.addEventListener('click', (e) => { if (e.target === m) m.style.display = 'none' })
})

// 实时搜索（防抖 300ms）
$('searchInput').addEventListener('input', () => {
  clearTimeout(searchTimer)
  searchTimer = setTimeout(() => doSearch(), 300)
})

// 回车立即搜索
$('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault()
    clearTimeout(searchTimer)
    doSearch()
  }
})

// 标签选择器：回车或失焦时提交输入
;[uploadPicker, editPicker].forEach((p) => {
  const inp = $(p.input)
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commitPickerInput(p) }
  })
  inp.addEventListener('blur', () => commitPickerInput(p))
})

// Ctrl+K 聚焦搜索框
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault()
    if ($('appView').style.display !== 'none') $('searchInput').focus()
  }
})

// ---- 初始化 ----
if (TOKEN) {
  $('loginView').style.display = 'none'
  $('appView').style.display = 'block'
  try {
    const payload = JSON.parse(atob(TOKEN.split('.')[0].replace(/-/g, '+').replace(/_/g, '/')))
    currentUser = { username: payload.username, role: payload.role }
    $('userInfo').textContent = '当前用户：' + payload.username + '（' + (payload.role === 'admin' ? '管理员' : '普通成员') + '）'
    $('adminBtn').style.display = payload.role === 'admin' ? 'inline-block' : 'none'
  } catch {}
  refreshList().catch(() => { logout() })
  loadMeta()
}
